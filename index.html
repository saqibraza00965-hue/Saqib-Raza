
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,user-scalable=no">
<title>SAQUIB OFFROAD WORLD</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101820;color:white;font-family:Arial}
#game{position:fixed;inset:0}
#top{
position:fixed;top:10px;left:10px;right:10px;
display:flex;justify-content:space-between;align-items:center;
z-index:5;pointer-events:none
}
#top div{background:#101820cc;padding:10px;border-radius:10px}
#controls{position:fixed;bottom:20px;left:0;right:0;
display:flex;justify-content:space-between;align-items:end;
padding:12px;z-index:5}
.group{display:flex;gap:12px;align-items:center}
.btn{
width:68px;height:68px;border-radius:50%;
background:#172c45dd;border:3px solid #00d9ff;
color:white;font-size:25px;font-weight:bold;
touch-action:none;user-select:none
}
#gas,#brake{width:65px;height:85px;border-radius:15px}
#menu{position:fixed;top:65px;right:10px;z-index:8;
display:flex;flex-direction:column;gap:8px}
.small{background:#112c45;color:white;border:1px solid #00d9ff;
padding:10px;border-radius:9px;font-weight:bold}
#panel{
display:none;position:fixed;z-index:10;top:50%;left:50%;
transform:translate(-50%,-50%);width:85%;max-width:350px;
background:#101b2c;border:2px solid #00d9ff;
border-radius:15px;padding:20px;text-align:center
}
#panel button{margin:8px}
#message{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);
background:#101820dd;padding:15px;border-radius:12px;display:none;z-index:7}
</style>
</head>
<body>
<div id="game"></div>

<div id="top">
 <div>🎮 SAQUIB OFFROAD</div>
 <div>Speed: <span id="speed">0</span> km/h</div>
</div>

<div id="menu">
 <button class="small" onclick="changeCamera()">📷 Camera</button>
 <button class="small" onclick="showPanel()">⚙ Customize</button>
 <button class="small" onclick="repair()">🔧 Garage</button>
</div>

<div id="controls">
 <div class="group">
  <button class="btn" id="left">◀</button>
  <button class="btn" id="right">▶</button>
 </div>
 <div class="group">
  <button class="btn" id="brake">BRAKE</button>
  <button class="btn" id="gas">▲</button>
 </div>
</div>

<div id="panel">
 <h2>⚙ CUSTOM CONTROLS</h2>
 <p>Button Size</p>
 <input type="range" min="50" max="100" value="68" id="size">
 <p>Camera View</p>
 <button class="small" onclick="changeCamera()">Change Camera</button>
 <p>Car Colour</p>
 <button class="small" onclick="paint('#ff2222')">Red</button>
 <button class="small" onclick="paint('#eeeeee')">White</button>
 <button class="small" onclick="paint('#111111')">Black</button>
 <br>
 <button class="small" onclick="closePanel()">SAVE</button>
</div>

<div id="message"></div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8ac9ed);
scene.fog=new THREE.Fog(0x8ac9ed,70,260);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x536b36,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-40,70,30);
sun.castShadow=true;
scene.add(sun);

function material(color){return new THREE.MeshStandardMaterial({color,roughness:.9})}

const grass=material(0x477c35);
const roadmat=material(0x856b4b);
const mudmat=material(0x493426);

// Ground
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),grass);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.12;
ground.receiveShadow=true;
scene.add(ground);

// Long village road
const road=new THREE.Mesh(new THREE.PlaneGeometry(11,500),roadmat);
road.rotation.x=-Math.PI/2;
road.position.set(0,0,-90);
road.receiveShadow=true;
scene.add(road);

// Mud patches
for(let i=0;i<22;i++){
 const m=new THREE.Mesh(new THREE.CircleGeometry(1+Math.random()*2,16),mudmat);
 m.rotation.x=-Math.PI/2;
 m.position.set((Math.random()-.5)*7,.025,-i*12-5);
 m.scale.set(1.5,.8,1);
 scene.add(m);
}

// Mountains
for(let i=0;i<35;i++){
 const h=15+Math.random()*30;
 const mountain=new THREE.Mesh(
  new THREE.ConeGeometry(12+Math.random()*15,h,5),
  material(i%2?0x596d4d:0x71805c)
 );
 mountain.position.set((Math.random()>.5?1:-1)*(25+Math.random()*80),
 h/2-1,-Math.random()*280);
 scene.add(mountain);
}

// Trees
function tree(x,z){
 const g=new THREE.Group();
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.4,3,7),material(0x654226));
 trunk.position.y=1.5;g.add(trunk);
 const leaves=new THREE.Mesh(new THREE.ConeGeometry(2.1,5,7),material(0x174d25));
 leaves.position.y=5;g.add(leaves);
 g.position.set(x,0,z);scene.add(g);
}
for(let i=0;i<180;i++){
 let x=(Math.random()>.5?1:-1)*(9+Math.random()*65);
 tree(x,-Math.random()*300);
}

// Garage
const garage=new THREE.Group();
const building=new THREE.Mesh(new THREE.BoxGeometry(12,6,8),material(0x888888));
building.position.y=3;garage.add(building);
const door=new THREE.Mesh(new THREE.BoxGeometry(5,4,0.2),material(0x252525));
door.position.set(0,2,-4.1);garage.add(door);
garage.position.set(15,0,-65);
scene.add(garage);

// SUV
const car=new THREE.Group();
const bodyMat=material(0x171d25);
const body=new THREE.Mesh(new THREE.BoxGeometry(2.6,1.15,4.4),bodyMat);
body.position.y=1.25;body.castShadow=true;car.add(body);

const cabin=new THREE.Mesh(new THREE.BoxGeometry(2.3,1.25,2.3),material(0x202b35));
cabin.position.set(0,2.35,-.25);car.add(cabin);

const glassmat=new THREE.MeshStandardMaterial({
 color:0x8cc5d9,metalness:.3,roughness:.2
});
const windshield=new THREE.Mesh(new THREE.BoxGeometry(2.05,.85,.08),glassmat);
windshield.position.set(0,2.4,1);car.add(windshield);

const wheels=[];
for(let x of [-1.35,1.35]){
 for(let z of [-1.4,1.4]){
  const w=new THREE.Mesh(
   new THREE.CylinderGeometry(.55,.55,.38,20),
   material(0x171717)
  );
  w.rotation.z=Math.PI/2;
  w.position.set(x,.65,z);
  w.castShadow=true;car.add(w);wheels.push(w);
 }
}
const bumper=new THREE.Mesh(new THREE.BoxGeometry(2.8,.3,.35),material(0x777777));
bumper.position.set(0,.75,2.3);car.add(bumper);
car.position.set(0,0,0);
scene.add(car);

// Driving
let speed=0,steer=0,cameraMode=0;
let gas=false,brake=false,left=false,right=false;
let carColor=0x171d25;

function hold(id,callback){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{e.preventDefault();callback(true)});
 el.addEventListener('pointerup',()=>callback(false));
 el.addEventListener('pointerleave',()=>callback(false));
 el.addEventListener('pointercancel',()=>callback(false));
}
hold('gas',v=>gas=v);
hold('brake',v=>brake=v);
hold('left',v=>left=v);
hold('right',v=>right=v);

function changeCamera(){cameraMode=(cameraMode+1)%2}
function paint(color){bodyMat.color.set(color);carColor=color}
window.changeCamera=changeCamera;
window.paint=paint;

window.showPanel=()=>document.getElementById('panel').style.display='block';
window.closePanel=()=>document.getElementById('panel').style.display='none';

document.getElementById('size').addEventListener('input',e=>{
 const s=Number(e.target.value);
 document.querySelectorAll('.btn').forEach(b=>{
  b.style.width=s+'px';b.style.height=s+'px';
 });
});

window.repair=()=>{
 if(car.position.distanceTo(new THREE.Vector3(15,0,-65))<25){
  speed=0;
  say('🔧 Garage: Your car is repaired!');
 }else{
  say('Drive near the garage to repair your car.');
 }
};

function say(t){
 const m=document.getElementById('message');
 m.textContent=t;m.style.display='block';
 setTimeout(()=>m.style.display='none',2500);
}

window.addEventListener('keydown',e=>{
 if(e.key==='ArrowUp'||e.key==='w')gas=true;
 if(e.key==='ArrowDown'||e.key==='s')brake=true;
 if(e.key==='ArrowLeft'||e.key==='a')left=true;
 if(e.key==='ArrowRight'||e.key==='d')right=true;
});
window.addEventListener('keyup',e=>{
 if(e.key==='ArrowUp'||e.key==='w')gas=false;
 if(e.key==='ArrowDown'||e.key==='s')brake=false;
 if(e.key==='ArrowLeft'||e.key==='a')left=false;
 if(e.key==='ArrowRight'||e.key==='d')right=false;
});

const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);

 if(gas)speed=Math.min(speed+15*dt,65);
 else speed*=Math.pow(.985,dt*60);
 if(brake)speed=Math.max(0,speed-35*dt);

 steer=(right?1:0)-(left?1:0);
 car.rotation.y-=steer*speed*.0009;
 car.position.x+=Math.sin(car.rotation.y)*speed*dt*.045;
 car.position.z-=Math.cos(car.rotation.y)*speed*dt*.045;

 car.position.x=THREE.MathUtils.clamp(car.position.x,-100,100);

 wheels.forEach(w=>w.rotation.x+=speed*dt*.06);

 if(cameraMode===0){
  const offset=new THREE.Vector3(0,6,11);
  offset.applyAxisAngle(new THREE.Vector3(0,1,0),car.rotation.y);
  const target=car.position.clone().add(offset);
  camera.position.lerp(target,.09);
  camera.lookAt(car.position.x,1.5,car.position.z-3);
 }else{
  const inside=new THREE.Vector3(0,2.8,.3);
  inside.applyAxisAngle(new THREE.Vector3(0,1,0),car.rotation.y);
  camera.position.copy(car.position).add(inside);
  camera.lookAt(
   car.position.x-Math.sin(car.rotation.y)*10,
   2.5,
   car.position.z-Math.cos(car.rotation.y)*10
  );
 }

 document.getElementById('speed').textContent=Math.round(speed);
 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
